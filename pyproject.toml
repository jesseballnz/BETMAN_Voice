[project]
name = "betman-voice"
version = "0.1.0"
description = "Production BETMAN voice generation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.40",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.16.0",
  "boto3>=1.38.0",
  "python-multipart>=0.0.20",
  "prometheus-client>=0.22.0",
  "structlog>=25.4.0",
  "PyJWT>=2.10.0",
  "passlib>=1.7.4",
  "httpx>=0.28.0",
  "piper-tts>=1.6.0"
]

[project.optional-dependencies]
models = [
  "numpy>=1.26.0,<2",
  "soundfile>=0.12.0",
  "torch>=2.2.2",
  "transformers>=4.36.0",
  "qwen-tts>=0.1.1"
]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "locust>=2.37.0"
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
